<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="styles">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body { font-family: sans-serif; margin: 1rem auto; max-width: 48rem; padding: 0 1rem; }
            nav a { margin-right: 1rem; }
            table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
            th, td { border: 1px solid #ccc; padding: 0.4rem; text-align: left; }
            .success { background: #e6f4ea; border: 1px solid #5a9b6b; padding: 0.5rem; }
            .error { background: #fce8e6; border: 1px solid #c5534a; padding: 0.5rem; }
            form { margin-bottom: 1rem; }
        </style>
    </th:block>
</head>
<body>
<nav id="nav" th:fragment="nav">
    <a id="nav-home" th:href="@{/}">Home</a>
    <a id="nav-officer" th:href="@{/officer}">Officer</a>
</nav>
<div th:fragment="messages">
    <p id="success-message" class="success" th:if="${success}" th:text="${success}"></p>
    <p id="error-message" class="error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
